<!-- This is file where you put your custom stuff for janraasch/hugo-scroll theme -->
{{ with resources.Get "favicon.png" }}<link rel="icon" type="image/png" href="{{ .RelPermalink }}" />{{ end }}
<style>

    :root {
      --cover-text-color: #f0f0f0 !important;
      --cover-title-text-shadow:  black 0px 2px 12px;
    }
    
    .mobile-only {
        display: none;
    }

    .desktop-only {
        display: block;
    }

    /* Selector for mobile devices - hopefully it works fairly okay */
    /* Rule of thumb - don't overuse this */
    @media only screen and (hover: none) and (pointer: coarse) {
        .mobile-only {
            display: block;
        }

        .desktop-only {
            display: none;
        }
    }

    /* Default font for text. NOTE: You need to force h1, h2... etc to change headers */
    body {
        font-family: Helvetica, sans-serif;
    }

    img {
        max-width: 100%;
        height: auto;
    }
    
    #site-head-content {
      padding-bottom: 16em;
    }

    .blog-title {
        /* fancy font: */
        
        font-family: Roboto Slab, Arial, sans-serif;
        font-weight: normal;
        font-size: 10rem !important;
    }

    /* on small screens */
    @media only screen and (max-width: 600px) {
        .blog-title {
            font-size: 6rem !important;
        }
    }

    /* Upper-left navigation - active item */
    a.fn-item.active {
        color: #000;
    }

    /* Background colorful color */
    .post-holder.odd {
        background: #7b9d00;
    }

    /* # MULTIPLE INLINE IMAGES - By Mati Blu and Kimi-K2 <3 */

    /* flex container only when paragraph holds image-links */
    p:has(a img) {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: space-between;
    }

    /* base behaviour for every image-link */
    p a:has(img) {
        flex: 1 1 auto !important;
        min-width: 144px;
    }

    /* count image-links, not plain links */
    p:has(a:nth-of-type(2) img) a:has(img) { max-width: 48%; }
    p:has(a:nth-of-type(3) img) a:has(img) { max-width: 32%; }
    p:has(a:nth-of-type(4) img) a:has(img) { max-width: 24%; }
    p:has(a:nth-of-type(5) img) a:has(img) { max-width: 19%; }
    p:has(a:nth-of-type(6) img) a:has(img) { max-width: 16%; }

</style>
