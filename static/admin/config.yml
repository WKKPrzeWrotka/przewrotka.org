backend:
  name: github
  repo: WKKPrzeWrotka/przewrotka.org
  site_domain: chipper-dolphin-c9621c.netlify.app
  branch: master
  
media_folder: assets/
public_folder: /
collections:
  - name: special
    label: Specjalne (główny baner itp)
    files: 
      - name: main_index
        label: Główny baner
        file: content/_index.md
        fields:
          - { name: header_image, label: Zdjęcie, widget: image }
          - { name: header_headline, label: Tytuł, widget: string }
          - { name: header_subheadline, label: Podtytuł, widget: string }
  - name: homepage
    label: Fragmenty strony głównej
    folder: content/homepage
    create: true
    media_folder: assets
    public_folder: /homepage/assets
    fields:
      - { name: title, label: Tytuł, widget: string }
      - { name: weight, label: Pozycja, widget: number, value_type: int}
      - { name: body, label: Treść, widget: markdown }
  - name: pages
    label: Pozostałe strony
    folder: content/
    create: true
    media_folder: assets
    public_folder: /assets
    fields:
      - { name: title, label: Tytuł, widget: string }
      - { name: body, label: Treść, widget: markdown }
