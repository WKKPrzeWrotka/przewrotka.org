backend:
  name: github
  repo: WKKPrzeWrotka/przewrotka.org
  site_domain: chipper-dolphin-c9621c.netlify.app
  branch: master
  
media_folder: assets/images
public_folder: /images
collections:
  - name: homepage
    label: Fragmenty strony głównej
    folder: content/homepage
    create: true
    fields:
      - { name: title, label: Tytuł, widget: string }
      - { name: weight, label: Pozycja, widget: number, value_type: int}
      - { name: body, label: Treść, widget: markdown }
