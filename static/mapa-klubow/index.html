<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa Klubów Akademickich</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif
        }

        /* container keeps everything together */
        .map-box {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* background map */
        .map {
            display: block;
            width: 100%;
            height: auto;
        }

        /* pin wrapper positions both icon and caption */
        .pin {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .25)); /* smooth blurry shade */
            transition: filter .25s ease;
        }

        .pin img {
            transition: transform .2s ease;
        }

        .pin:hover img {
            transform: scale(1.15);
        }

        .pin span {
            font-size: 48px;
            color: #000;
        }

        .pin, a {
            text-decoration: none;
        }

        #przewrotka {
            left: 33%;
            top: 68%;
        }

        #morzkulc {
            left: 43%;
            top: 14%;
        }

        #bystrze {
            left: 58%;
            top: 80%;
        }

        #habazie {
            left: 65%;
            top: 48%;
        }

        #pantarei {
            left: 25%;
            top: 40%;
        }

        #przewrotka, img {
            height: 25%;
            width: auto;
        }

        #morzkulc, img {
            height: 25%;
            width: auto;
        }

        #bystrze, img {
            height: 30%;
            width: auto;
        }

        #habazie, img {
            height: 30%;
            width: auto;
        }

        #pantarei, img {
            height: 40%;
            width: auto;
        }

    </style>
</head>
<body>
<div class="map-box">
    <img class="map" src="poland.svg">
    <a id="przewrotka" class="pin" href="https://przewrotka.org" target="_top"><img src="przewrotka.svg"><span>Wrocław</span></a>
    <a id="morzkulc" class="pin" href="http://www.morzkulc.pg.gda.pl/" target="_top"><img src="morzkulc.svg"><span>Gdańsk</span></a>
    <a id="bystrze" class="pin" href="https://bystrze.org/" target="_top"><img src="bystrze.svg"><span>Kraków</span></a>
    <a id="habazie" class="pin" href="https://www.habazie.pl/" target="_top"><img src="habazie.svg"><span>Warszawa</span></a>
    <a id="pantarei" class="pin" href="https://pantarei.org.pl/" target="_top"><img src="pantarei.svg"><span>Poznań</span></a>
</div>
</body>
</html>
